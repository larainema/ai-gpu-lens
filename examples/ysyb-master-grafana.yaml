# ysyb-master / luna Grafana read-only audit template.
#
# Environment kubeconfig, when Kubernetes API access is needed separately:
# /Users/dong/.kube/ysyb-master.config
#
# This file intentionally does not store passwords or tokens.

prometheus_url: https://grafana.luna.ogpu.cloud/api/datasources/proxy/uid/prometheus
hours: 24
step: 5m
language: zh

output: reports/ysyb-master-grafana.html
json_output: reports/ysyb-master-grafana.json
markdown_output: reports/ysyb-master-grafana.md

price_per_gpu_hour: 2.50
gpu_prices:
  H100: 4.25
  4090: 0.65

# For local interactive use:
basic_auth_user: admin
prompt_basic_auth_password: true

# For safer automation, prefer a Viewer/service-account token and set:
# bearer_token_env: GRAFANA_TOKEN
