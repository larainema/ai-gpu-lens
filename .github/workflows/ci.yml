name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Generate sample reports
        run: |
          ./bin/ai-gpu-lens audit \
            --from-file examples/sample-prometheus.json \
            --output reports/sample.html \
            --json-output reports/sample.json \
            --markdown-output reports/sample.md \
            --price-per-gpu-hour 2.50 \
            --language zh

      - name: Generate sample bundle
        run: |
          ./bin/ai-gpu-lens bundle \
            --from-file examples/sample-prometheus.json \
            --name sample-delivery \
            --output-dir reports/sample-delivery \
            --archive reports/sample-delivery.zip \
            --price-per-gpu-hour 2.50 \
            --language zh

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl
          ai-gpu-lens --help
          ai-gpu-lens audit \
            --from-file examples/sample-prometheus.json \
            --output /tmp/sample.html \
            --json-output /tmp/sample.json \
            --markdown-output /tmp/sample.md
          ai-gpu-lens bundle \
            --from-file examples/sample-prometheus.json \
            --name sample-delivery \
            --output-dir /tmp/sample-delivery \
            --archive /tmp/sample-delivery.zip

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-gpu-lens:ci .

      - name: Smoke test image
        run: |
          docker run --rm ai-gpu-lens:ci --help
          docker run --rm ai-gpu-lens:ci audit \
            --from-file examples/sample-prometheus.json \
            --output /tmp/sample.html \
            --json-output /tmp/sample.json \
            --markdown-output /tmp/sample.md
          docker run --rm ai-gpu-lens:ci bundle \
            --from-file examples/sample-prometheus.json \
            --name sample-delivery \
            --output-dir /tmp/sample-delivery \
            --archive /tmp/sample-delivery.zip
