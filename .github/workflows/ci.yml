name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Generate sample reports
        run: |
          ./bin/ai-gpu-lens audit \
            --from-file examples/sample-prometheus.json \
            --output reports/sample.html \
            --json-output reports/sample.json \
            --markdown-output reports/sample.md \
            --price-per-gpu-hour 2.50 \
            --language zh

      - name: Generate sample bundle
        run: |
          ./bin/ai-gpu-lens bundle \
            --from-file examples/sample-prometheus.json \
            --name sample-delivery \
            --output-dir reports/sample-delivery \
            --archive reports/sample-delivery.zip \
            --price-per-gpu-hour 2.50 \
            --language zh

      - name: Generate sample comparison
        run: |
          ./bin/ai-gpu-lens compare \
            --before reports/sample.json \
            --after reports/sample-delivery/audit.json \
            --output reports/sample-comparison.html \
            --json-output reports/sample-comparison.json \
            --markdown-output reports/sample-comparison.md \
            --language zh

      - name: Generate sample Grafana dashboard
        run: |
          ./bin/ai-gpu-lens dashboard \
            --output reports/ai-gpu-lens-dashboard.json

      - name: Generate redacted sample artifacts
        run: |
          ./bin/ai-gpu-lens redact \
            --input reports/sample.json \
            --output reports/sample-redacted.json \
            --html-output reports/sample-redacted.html \
            --markdown-output reports/sample-redacted.md \
            --case-study-output reports/sample-case-study.md \
            --title "Anonymized GPU Audit Case Study" \
            --cluster-name demo-cluster \
            --language en

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel
        run: |
          python -m pip install dist/*.whl
          ai-gpu-lens --help
          ai-gpu-lens audit \
            --from-file examples/sample-prometheus.json \
            --output /tmp/sample.html \
            --json-output /tmp/sample.json \
            --markdown-output /tmp/sample.md
          ai-gpu-lens bundle \
            --from-file examples/sample-prometheus.json \
            --name sample-delivery \
            --output-dir /tmp/sample-delivery \
            --archive /tmp/sample-delivery.zip
          ai-gpu-lens compare \
            --before /tmp/sample.json \
            --after /tmp/sample-delivery/audit.json \
            --output /tmp/sample-comparison.html \
            --json-output /tmp/sample-comparison.json \
            --markdown-output /tmp/sample-comparison.md
          ai-gpu-lens dashboard \
            --output /tmp/ai-gpu-lens-dashboard.json
          ai-gpu-lens redact \
            --input /tmp/sample.json \
            --output /tmp/sample-redacted.json \
            --html-output /tmp/sample-redacted.html \
            --markdown-output /tmp/sample-redacted.md \
            --case-study-output /tmp/sample-case-study.md

  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-gpu-lens:ci .

      - name: Smoke test image
        run: |
          docker run --rm ai-gpu-lens:ci --help
          tmpdir="$(mktemp -d)"
          docker run --rm -v "$tmpdir:/out" ai-gpu-lens:ci audit \
            --from-file examples/sample-prometheus.json \
            --output /out/sample.html \
            --json-output /out/sample.json \
            --markdown-output /out/sample.md
          docker run --rm -v "$tmpdir:/out" ai-gpu-lens:ci bundle \
            --from-file examples/sample-prometheus.json \
            --name sample-delivery \
            --output-dir /out/sample-delivery \
            --archive /out/sample-delivery.zip
          docker run --rm -v "$tmpdir:/out" ai-gpu-lens:ci compare \
            --before /out/sample.json \
            --after /out/sample-delivery/audit.json \
            --output /out/sample-comparison.html \
            --json-output /out/sample-comparison.json \
            --markdown-output /out/sample-comparison.md
          docker run --rm -v "$tmpdir:/out" ai-gpu-lens:ci dashboard \
            --output /out/ai-gpu-lens-dashboard.json
          docker run --rm -v "$tmpdir:/out" ai-gpu-lens:ci redact \
            --input /out/sample.json \
            --output /out/sample-redacted.json \
            --html-output /out/sample-redacted.html \
            --markdown-output /out/sample-redacted.md \
            --case-study-output /out/sample-case-study.md

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.3

      - name: Lint chart
        run: helm lint charts/ai-gpu-lens

      - name: Render chart
        run: |
          helm template gpu-audit charts/ai-gpu-lens
          helm template gpu-audit charts/ai-gpu-lens \
            --set config.prometheusUrl=https://grafana.example.com/api/datasources/proxy/uid/prometheus \
            --set auth.basicAuth.username=viewer \
            --set auth.basicAuth.existingSecret=grafana-viewer-basic-auth \
            --set persistence.enabled=false

      - name: Package chart
        run: |
          mkdir -p /tmp/charts
          helm package charts/ai-gpu-lens --destination /tmp/charts
